<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human vs Stockfish</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">CHESS ENGINE MATCH</p>
        <h1>Human vs Stockfish</h1>
        <p class="subtitle">Play against Stockfish 18 Lite WASM directly in your browser.</p>
      </div>
      <div id="engineBadge" class="badge waiting">ENGINE STARTING</div>
    </header>

    <section class="layout">
      <div class="board-column">
        <div class="player-bar">
          <div>
            <span class="player-label">BLACK</span>
            <strong id="blackName">Stockfish</strong>
          </div>
          <span id="blackStatus">Waiting…</span>
        </div>

        <div class="board-frame">
          <div id="board" class="board"></div>
        </div>

        <div class="player-bar">
          <div>
            <span class="player-label">WHITE</span>
            <strong id="whiteName">Human</strong>
          </div>
          <span id="whiteStatus">Your move</span>
        </div>

        <div class="controls">
          <button id="newGameBtn" class="primary">New Game</button>
          <button id="undoBtn">Undo</button>
          <button id="flipBtn">Flip Board</button>
        </div>

        <p id="gameStatus" class="game-status">Loading…</p>
      </div>

      <aside class="sidebar">
        <section class="card">
          <h2>Game Settings</h2>

          <label>
            <span>Play as</span>
            <select id="sideSelect">
              <option value="w">White</option>
              <option value="b">Black</option>
            </select>
          </label>

          <label>
            <span>Stockfish depth <b id="depthValue">10</b></span>
            <input id="depthSlider" type="range" min="1" max="18" value="10" />
          </label>

          <label>
            <span>AI move delay <b id="delayValue">400 ms</b></span>
            <input id="delaySlider" type="range" min="0" max="2000" step="100" value="400" />
          </label>
        </section>

        <section class="card">
          <h2>Position</h2>
          <div class="stat-grid">
            <div><span>Turn</span><strong id="turnText">White</strong></div>
            <div><span>Ply</span><strong id="plyText">0</strong></div>
            <div><span>Evaluation</span><strong id="evalText">—</strong></div>
            <div><span>Best move</span><strong id="bestMoveText">—</strong></div>
          </div>
        </section>

        <section class="card">
          <h2>Moves</h2>
          <pre id="moves">No moves yet.</pre>
        </section>

        <section class="card">
          <div class="card-title">
            <h2>Engine Log</h2>
            <button id="clearLogBtn" class="mini">Clear</button>
          </div>
          <pre id="log">Booting Stockfish…</pre>
        </section>
      </aside>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
